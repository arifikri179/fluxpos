<!DOCTYPE html>
<html>
<head>
    <style>
        .button {
            background-color: #3b82f6;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            display: inline-block;
        }
    </style>
</head>
<body style="font-family: sans-serif; background-color: #f4f7f6; padding: 20px;">
    <div style="max-width: 600px; background: white; padding: 30px; border-radius: 15px; margin: auto;">
        <h2 style="color: #001529;">Halo, {{ first_name }}!</h2>
        <p>Kami menerima permintaan untuk mengatur ulang password akun FluxPOS Anda.</p>
        <p>Silakan klik tombol di bawah ini untuk melanjutkan:</p>
        <div style="text-align: center; margin: 30px 0;">
            <a href="{{ reset_link }}" class="button" style="color: white !important;">RESET PASSWORD</a>
        </div>
        <p style="font-size: 12px; color: #666;">Jika Anda tidak merasa melakukan permintaan ini, abaikan email ini.</p>
        <hr style="border: none; border-top: 1px solid #eee; margin: 20px 0;">
        <p style="font-size: 10px; color: #aaa; text-align: center;">FluxPOS Engine &copy; 2026</p>
    </div>
</body>
</html>
